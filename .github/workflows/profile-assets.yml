name: Profile assets

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.METRICS_TOKEN }}
          outputs: |
            dist/snake.svg?color_snake=#b8aa00&color_dots=#e6fbfd,#b3f6fb,#66eef7,#00d4e0,#00a3b0
            dist/snake-dark.svg?color_snake=#fcee0a&color_dots=#0d1a2b,#0e3a5c,#007f8f,#00c4d4,#00f0ff

      # METRICS_TOKEN must be able to read private repositories to count private work.
      - run: python3 scripts/stats.py dist/stats.svg
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
