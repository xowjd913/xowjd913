name: Profile assets

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.METRICS_TOKEN }}
          outputs: |
            dist/snake.svg?color_snake=#7a2fd0&color_dots=#efe6ff,#e0b8ff,#c37dff,#a04bf0,#ff4fd8
            dist/snake-dark.svg?color_snake=#3ee8ff&color_dots=#1c1233,#4a1f7a,#8a2fd6,#d43cf0,#ff4fd8

      # METRICS_TOKEN must be able to read private repositories to count private work.
      - run: python3 scripts/stats.py dist/stats.svg
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
