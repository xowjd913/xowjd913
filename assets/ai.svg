<svg xmlns="http://www.w3.org/2000/svg" width="830" height="290" viewBox="0 0 830 290"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0a24"/><stop offset="1" stop-color="#07060f"/></linearGradient>
<filter id="g" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#8f9cc8"/></marker></defs><style>.n{font:700 17px 'Segoe UI',Ubuntu,sans-serif}.p{font:600 12px 'Segoe UI',Ubuntu,sans-serif;fill:#cfd8ff}.s{font:400 12px 'Segoe UI',Ubuntu,sans-serif;fill:#8f9cc8}.h{font:800 14px 'Segoe UI',Ubuntu,sans-serif;letter-spacing:2px}.d{font:400 12.5px 'Segoe UI',Ubuntu,sans-serif;fill:#cfd8ff}.f{font:800 13px 'Segoe UI',Ubuntu,sans-serif;letter-spacing:1.5px}.m{font:400 11px 'Segoe UI',Ubuntu,sans-serif;fill:#8f9cc8}.l{fill:none;stroke:#8f9cc8;stroke-width:1.5}</style>
<rect x="1" y="1" width="828" height="76" rx="10" fill="url(#bg)" stroke="#00f0ff" stroke-opacity=".35" stroke-width="1.5"/>
<rect x="24" y="17" width="120" height="44" rx="8" fill="#07060f" stroke="#fcee0a" stroke-opacity=".75" stroke-width="1.5"/><text x="84" y="36" text-anchor="middle" class="f" fill="#fcee0a" filter="url(#g)">YOU</text><text x="84" y="52" text-anchor="middle" class="m">request &amp; verify</text>
<rect x="194" y="17" width="120" height="44" rx="8" fill="#07060f" stroke="#00f0ff" stroke-opacity=".75" stroke-width="1.5"/><text x="254" y="36" text-anchor="middle" class="f" fill="#00f0ff" filter="url(#g)">PO</text><text x="254" y="52" text-anchor="middle" class="m">plans &amp; triages</text>
<rect x="364" y="17" width="140" height="44" rx="8" fill="#07060f" stroke="#fcee0a" stroke-opacity=".75" stroke-width="1.5"/><text x="434" y="36" text-anchor="middle" class="f" fill="#fcee0a" filter="url(#g)">LEADER</text><text x="434" y="52" text-anchor="middle" class="m">splits into issues</text>
<path class="l" d="M148 39 H190" marker-end="url(#a)"/><path class="l" d="M318 39 H360" marker-end="url(#a)"/><path class="l" d="M508 39 H548 M548 23 V55"/><path class="l" d="M548 23 H600" marker-end="url(#a)"/><path class="l" d="M548 55 H600" marker-end="url(#a)"/>
<rect x="604" y="9" width="210" height="28" rx="8" fill="#07060f" stroke="#00f0ff" stroke-opacity=".75" stroke-width="1.5"/><text x="620" y="27" class="f" fill="#00f0ff" filter="url(#g)">WORKER</text><text x="722" y="27" class="m">implements</text>
<rect x="604" y="41" width="210" height="28" rx="8" fill="#07060f" stroke="#fcee0a" stroke-opacity=".75" stroke-width="1.5"/><text x="620" y="59" class="f" fill="#fcee0a" filter="url(#g)">REVIEWER</text><text x="722" y="59" class="m">reviews PRs</text>
<rect x="1" y="91" width="406" height="92" rx="10" fill="url(#bg)" stroke="#00f0ff" stroke-opacity=".75" stroke-width="1.5"/><rect x="15" y="107" width="3" height="60" rx="1.5" fill="#00f0ff" filter="url(#g)"/><text x="31" y="123" class="h" fill="#00f0ff" filter="url(#g)">HUMAN IN THE LOOP</text><text x="31" y="147" class="d">I verify every change and merge it myself.</text><text x="31" y="165" class="d">Agents never force-push to the base branch.</text>
<rect x="423" y="91" width="406" height="92" rx="10" fill="url(#bg)" stroke="#fcee0a" stroke-opacity=".75" stroke-width="1.5"/><rect x="437" y="107" width="3" height="60" rx="1.5" fill="#fcee0a" filter="url(#g)"/><text x="453" y="123" class="h" fill="#fcee0a" filter="url(#g)">COST-AWARE MODELS</text><text x="453" y="147" class="d">Sonnet by default, Opus only when judgment is</text><text x="453" y="165" class="d">needed. Work is gated by remaining usage limits.</text>
<rect x="1" y="197" width="406" height="92" rx="10" fill="url(#bg)" stroke="#fcee0a" stroke-opacity=".75" stroke-width="1.5"/><rect x="15" y="213" width="3" height="60" rx="1.5" fill="#fcee0a" filter="url(#g)"/><text x="31" y="229" class="h" fill="#fcee0a" filter="url(#g)">INDEPENDENT REVIEW</text><text x="31" y="253" class="d">Every PR goes through a separate reviewer agent</text><text x="31" y="271" class="d">before I test it myself.</text>
<rect x="423" y="197" width="406" height="92" rx="10" fill="url(#bg)" stroke="#00f0ff" stroke-opacity=".75" stroke-width="1.5"/><rect x="437" y="213" width="3" height="60" rx="1.5" fill="#00f0ff" filter="url(#g)"/><text x="453" y="229" class="h" fill="#00f0ff" filter="url(#g)">SHARED RULES</text><text x="453" y="253" class="d">One private rules repo keeps model choice, PR</text><text x="453" y="271" class="d">format and review scope consistent everywhere.</text></svg>
