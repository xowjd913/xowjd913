<svg xmlns="http://www.w3.org/2000/svg" width="830" height="200" viewBox="0 0 830 200"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0a24"/><stop offset="1" stop-color="#07060f"/></linearGradient>
<filter id="g" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>.n{font:700 17px 'Segoe UI',Ubuntu,sans-serif}.p{font:600 12px 'Segoe UI',Ubuntu,sans-serif;fill:#cfd8ff}.s{font:400 12px 'Segoe UI',Ubuntu,sans-serif;fill:#8f9cc8}.h{font:800 14px 'Segoe UI',Ubuntu,sans-serif;letter-spacing:2px}.d{font:400 12.5px 'Segoe UI',Ubuntu,sans-serif;fill:#cfd8ff}</style><rect x="1.0" y="1" width="406.0" height="92" rx="10" fill="url(#bg)" stroke="#00f0ff" stroke-opacity=".75" stroke-width="1.5"/><rect x="15.0" y="17" width="3" height="60" rx="1.5" fill="#00f0ff" filter="url(#g)"/><text x="31.0" y="33" class="h" fill="#00f0ff" filter="url(#g)">AGENT TEAM</text><text x="31.0" y="57" class="d">A lead agent splits work into issues and runs</text><text x="31.0" y="75" class="d">developer–reviewer agent pairs in parallel worktrees</text><rect x="423.0" y="1" width="406.0" height="92" rx="10" fill="url(#bg)" stroke="#fcee0a" stroke-opacity=".75" stroke-width="1.5"/><rect x="437.0" y="17" width="3" height="60" rx="1.5" fill="#fcee0a" filter="url(#g)"/><text x="453.0" y="33" class="h" fill="#fcee0a" filter="url(#g)">INDEPENDENT REVIEW</text><text x="453.0" y="57" class="d">Every feature PR goes through a separate reviewer</text><text x="453.0" y="75" class="d">agent before a human tests and merges</text><rect x="1.0" y="107" width="406.0" height="92" rx="10" fill="url(#bg)" stroke="#fcee0a" stroke-opacity=".75" stroke-width="1.5"/><rect x="15.0" y="123" width="3" height="60" rx="1.5" fill="#fcee0a" filter="url(#g)"/><text x="31.0" y="139" class="h" fill="#fcee0a" filter="url(#g)">AGENT OFFICE</text><text x="31.0" y="163" class="d">A pixel-art office that shows what each agent</text><text x="31.0" y="181" class="d">is doing in real time</text><rect x="423.0" y="107" width="406.0" height="92" rx="10" fill="url(#bg)" stroke="#00f0ff" stroke-opacity=".75" stroke-width="1.5"/><rect x="437.0" y="123" width="3" height="60" rx="1.5" fill="#00f0ff" filter="url(#g)"/><text x="453.0" y="139" class="h" fill="#00f0ff" filter="url(#g)">SHARED RULES</text><text x="453.0" y="163" class="d">One rule repository keeps model choice, PR format</text><text x="453.0" y="181" class="d">and review scope consistent across projects</text></svg>
