s</text><path class="l" d="M490 39 H510 M510 26 V52"/><path class="l" d="M510 26 H532" marker-end="url(#a)"/><rect x="536" y="15" width="276" height="22" rx="8" fill="#171c28" stroke="#7ea6e0" stroke-opacity=".75" stroke-width="1.5"/><text x="552" y="30" class="f" fill="#7ea6e0" filter="url(#g)">WORKER</text><text x="660" y="30" class="m">implements</text><path class="l" d="M510 52 H532" marker-end="url(#a)"/><rect x="536" y="41" width="276" height="22" rx="8" fill="#171c28" stroke="#9bc4b4" stroke-opacity=".75" stroke-width="1.5"/><text x="552" y="56" class="f" fill="#9bc4b4" filter="url(#g)">REVIEWER</text><text x="660" y="56" class="m">reviews PRs</text><path class="l" d="M336 95 H352" marker-end="url(#a)"/><rect x="356" y="71" width="130" height="48" rx="8" fill="#171c28" stroke="#9bc4b4" stroke-opacity=".75" stroke-width="1.5"/><text x="421" y="90" text-anchor="middle" class="f" fill="#9bc4b4" filter="url(#g)">LEADER 2</text><text x="421" y="106" text-anchor="middle" class="m">splits into issues</text><path class="l" d="M490 95 H510 M510 82 V108"/><path class="l" d="M510 82 H532" marker-end="url(#a)"/><rect x="536" y="71" width="276" height="22" rx="8" fill="#171c28" stroke="#7ea6e0" stroke-opacity=".75" stroke-width="1.5"/><text x="552" y="86" class="f" fill="#7ea6e0" filter="url(#g)">WORKER</text><text x="660" y="86" class="m">implements</text><path class="l" d="M510 108 H532" marker-end="url(#a)"/><rect x="536" y="97" width="276" height="22" rx="8" fill="#171c28" stroke="#9bc4b4" stroke-opacity=".75" stroke-width="1.5"/><text x="552" y="112" class="f" fill="#9bc4b4" filter="url(#g)">REVIEWER</text><text x="660" y="112" class="m">reviews PRs</text><path class="l" d="M336 151 H352" marker-end="url(#a)"/><rect x="356" y="127" width="130" height="48" rx="8" fill="#171c28" stroke="#9bc4b4" stroke-opacity=".75" stroke-width="1.5"/><text x="421" y="146" text-anchor="middle" class="f" fill="#9bc4b4" filter="url(#g)">LEADER 3</text><text x="421" y="162" text-anchor="middle" class="m">splits into issues</text><path class="l" d="M490 151 H510 M510 138 V164"/><path class="l" d="M510 138 H532" marker-end="url(#a)"/><rect x="536" y="127" width="276" height="22" rx="8" fill="#171c28" stroke="#7ea6e0" stroke-opacity=".75" stroke-width="1.5"/><text x="552" y="142" class="f" fill="#7ea6e0" filter="url(#g)">WORKER</text><text x="660" y="142" class="m">implements</text><path class="l" d="M510 164 H532" marker-end="url(#a)"/><rect x="536" y="153" width="276" height="22" rx="8" fill="#171c28" stroke="#9bc4b4" stroke-opacity=".75" stroke-width="1.5"/><text x="552" y="168" class="f" fill="#9bc4b4" filter="url(#g)">REVIEWER</text><text x="660" y="168" class="m">reviews PRs</text><rect x="1.0" y="205" width="406.0" height="92" rx="10" fill="url(#bg)" stroke="#7ea6e0" stroke-opacity=".75" stroke-width="1.5"/><rect x="15.0" y="221" width="3" height="60" rx="1.5" fill="#7ea6e0" filter="url(#g)"/><text x="31.0" y="237" class="h" fill="#7ea6e0" filter="url(#g)">HUMAN IN THE LOOP</text><text x="31.0" y="261" class="d">I verify every change and merge it myself.</text><text x="31.0" y="279" class="d">Agents never force-push to the base branch.</text><rect x="423.0" y="205" width="406.0" height="92" rx="10" fill="url(#bg)" stroke="#9bc4b4" stroke-opacity=".75" stroke-width="1.5"/><rect x="437.0" y="221" width="3" height="60" rx="1.5" fill="#9bc4b4" filter="url(#g)"/><text x="453.0" y="237" class="h" fill="#9bc4b4" filter="url(#g)">COST-AWARE MODELS</text><text x="453.0" y="261" class="d">Sonnet by default, Opus only when judgment is</text><text x="453.0" y="279" class="d">needed. Work is gated by remaining usage limits.</text><rect x="1.0" y="311" width="406.0" height="92" rx="10" fill="url(#bg)" stroke="#9bc4b4" stroke-opacity=".75" stroke-width="1.5"/><rect x="15.0" y="327" width="3" height="60" rx="1.5" fill="#9bc4b4" filter="url(#g)"/><text x="31.0" y="343" class="h" fill="#9bc4b4" filter="url(#g)">INDEPENDENT REVIEW</text><text x="31.0" y="367" class="d">Every PR goes through a separate reviewer agent</text><text x="31.0" y="385" class="d">before I test it myself.</text><rect x="423.0" y="311" width="406.0" height="92" rx="10" fill="url(#bg)" stroke="#7ea6e0" stroke-opacity=".75" stroke-width="1.5"/><rect x="437.0" y="327" width="3" height="60" rx="1.5" fill="#7ea6e0" filter="url(#g)"/><text x="453.0" y="343" class="h" fill="#7ea6e0" filter="url(#g)">SHARED RULES</text><text x="453.0" y="367" class="d">One private rules repo keeps model choice, PR</text><text x="453.0" y="385" class="d">format and review scope consistent everywhere.</text></svg>
